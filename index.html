<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E2A3F">
<title>Revision</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0E2A3F;--ink:#0F2233;--muted:#5F7385;--line:#D3E0EB;--paper:#EDF2F6;--sky:#3A86C8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;padding:calc(32px + env(safe-area-inset-top)) 16px 48px}
main{max-width:720px;margin:0 auto}
h1{font-family:'Space Grotesk',sans-serif;font-size:2rem;letter-spacing:-.02em;margin-bottom:6px}
p.sub{color:var(--muted);margin-bottom:24px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
a.card{display:block;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;text-decoration:none;color:inherit;box-shadow:0 6px 20px rgba(15,34,51,.07)}
a.card:hover{border-color:var(--sky)}
.subj{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);margin-bottom:6px}
.t{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.2rem;margin-bottom:4px}
.d{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1>Revision</h1>
  <p class="sub">Year 8 study apps, one per topic.</p>
  <div class="grid">
    <a class="card" href="meteorology/"><div class="subj">Geography</div><div class="t">Meteorology</div><div class="d">Flashcards, quiz, exam practice and games.</div></a>
    <a class="card" href="spanish/"><div class="subj">Spanish</div><div class="t">El pretérito · Las vacaciones</div><div class="d">Past tense, holiday sentences, writing and translation practice.</div></a>
    <a class="card" href="https://jamesmandikos.github.io/margot-bio-world/"><div class="subj">Biology</div><div class="t">Classification</div><div class="d">The original biology app.</div></a>
  </div>
</main>
</body>
</html>
