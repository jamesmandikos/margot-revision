<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121C26">
<title>Class materials</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#121C26;--text:#16222E;--muted:#5E6E7E;--line:#DCE3EA;--paper:#EEF2F5;
  --display:'Space Grotesk',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--paper);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}
.hero{background:var(--ink);color:#fff;padding:calc(28px + env(safe-area-inset-top)) 20px 34px}
.hero-in{max-width:1080px;margin:0 auto}
.back{color:#fff;opacity:.7;text-decoration:none;font-size:.9rem;font-weight:600}
.back:hover{opacity:1}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,4.5vw,2.8rem);letter-spacing:-.03em;margin-top:14px}
.lede{opacity:.75;margin-top:8px;max-width:620px;line-height:1.5}
main{max-width:1080px;margin:0 auto;padding:24px 16px 56px;display:grid;gap:20px}
@media(min-width:1000px){main{grid-template-columns:1fr 1fr;align-items:start}}
.subject{background:#fff;border-radius:20px;padding:22px;box-shadow:0 1px 2px rgba(18,28,38,.06),0 12px 32px rgba(18,28,38,.08);border-top:6px solid var(--c)}
.met{--c:#164A73;--c2:#3A86C8}.spa{--c:#A13D24;--c2:#A13D24}.avg{--c:#3D348B;--c2:#2A9D8F}
.sh{display:flex;gap:14px;align-items:center}
.icon{width:50px;height:50px;border-radius:14px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}
.subj{font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--c2)}
h2{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:-.01em;margin-top:2px}
.when{color:var(--muted);font-size:.88rem;margin-top:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.btn{display:inline-flex;align-items:center;min-height:42px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);text-decoration:none;color:var(--text);font-weight:600;font-size:.88rem;background:#fff}
.btn.primary{background:var(--c);border-color:var(--c);color:#fff}
h3{font-family:var(--mono);font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
ul{list-style:none;display:grid;gap:6px}
li a{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px;padding:10px 12px;border-radius:12px;background:var(--paper);text-decoration:none;color:var(--text);font-weight:500;font-size:.94rem;line-height:1.35;border:1px solid transparent;transition:border-color .15s,background .15s}
li a:hover{background:#fff;border-color:var(--c2)}
.type{font-family:var(--mono);font-size:.68rem;font-weight:600;letter-spacing:.06em;padding:4px 8px;border-radius:6px;flex-shrink:0;background:#fff;color:var(--muted);border:1px solid var(--line)}
.t-slides{color:#B06A00;border-color:#F1D9A8;background:#FFF6E3}
.t-doc,.t-word{color:#1F5FBF;border-color:#C9DAF5;background:#EEF4FF}
.t-pdf{color:#B3261E;border-color:#F2C7C3;background:#FDEEEC}
.t-powerpoint{color:#B5471D;border-color:#F2CDBF;background:#FDF0EA}
.t-quizlet{color:#4255FF;border-color:#CDD3FF;background:#F0F2FF}
.note{max-width:1080px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:.86rem;line-height:1.5}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-in">
    <a class="back" href="../">← Revision</a>
    <h1>Class materials</h1>
    <p class="lede">Everything from Google Classroom for the coming tests: revision lists first, then the lesson slides. Each link opens the original in Google.</p>
  </div>
</header>
<main>
<!--SECTIONS-->
</main>
<p class="note">Google files open with your school account (sign in as you do for Classroom). Quizlet sets open without signing in.</p>
</body>
</html>
